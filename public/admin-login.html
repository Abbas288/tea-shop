<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Admin login · Tea Shop</title>
    <link href="vendor/furni/css/bootstrap.min.css" rel="stylesheet" />
    <link href="vendor/bootstrap-examples/sign-in/signin.css" rel="stylesheet" />
  </head>
  <body class="text-center">
    <main class="form-signin">
      <form id="login-form" method="post">
        <h1 class="h3 mb-3 fw-normal">Tea Shop admin</h1>

        <div class="form-floating">
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="name@example.com"
            autocomplete="username"
          />
          <label for="email">Email address</label>
        </div>
        <div class="form-floating">
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
          />
          <label for="password">Password</label>
        </div>

        <button class="w-100 btn btn-lg btn-primary" type="submit">Log in</button>
        <p class="mt-5 mb-3 text-muted"><a href="./">Back to the shop</a></p>
      </form>
    </main>
  </body>
</html>
