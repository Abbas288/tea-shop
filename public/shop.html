<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Tea Shop</title>
    <link href="vendor/furni/css/bootstrap.min.css" rel="stylesheet" />
    <link href="vendor/furni/css/style.css" rel="stylesheet" />
    <link href="css/shop.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" aria-label="Tea Shop navigation">
      <div class="container">
        <a class="navbar-brand" href="./">Tea Shop<span>.</span></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-menu"
          aria-controls="main-menu"
          aria-expanded="false"
          aria-label="Show the menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-menu">
          <ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
            <li class="active"><a class="nav-link" href="./" aria-current="page">Shop</a></li>
            <li><a class="nav-link" href="track">Track order</a></li>
          </ul>
          <ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5">
            <li>
              <a class="nav-link" href="cart"><img src="vendor/furni/images/cart.svg" alt="Cart" /></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="hero">
      <div class="container">
        <div class="row justify-content-between">
          <div class="col-lg-5">
            <div class="intro-excerpt">
              <h1>Our teas</h1>
              <p class="mb-4">Four loose teas, each in a bag of 100 g. This is a demo shop: no real payment is made.</p>
            </div>
          </div>
          <div class="col-lg-7 d-none d-lg-block">
            <div class="hero-img-wrap">
              <img src="images/hero-cup.webp" class="img-fluid" width="624" height="310" alt="" />
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <tea-product-list></tea-product-list>
      <tea-cart-toast></tea-cart-toast>
    </main>

    <footer class="footer-section">
      <div class="container relative">
        <div class="border-top copyright">
          <div class="row pt-4">
            <div class="col-lg-6">
              <p class="mb-2 text-center text-lg-start">
                Tea Shop is a demo. Design by <a href="https://untree.co">Untree.co</a>, distributed by
                <a href="https://themewagon.com">ThemeWagon</a> (CC BY 3.0). Tea photos by soultea.de / André Helbig (<a
                  href="images/teas/CREDITS.md"
                  >CC BY-SA 3.0</a
                >).
              </p>
            </div>
            <div class="col-lg-6 text-center text-lg-end">
              <ul class="list-unstyled d-inline-flex ms-auto">
                <li class="me-4"><a href="mailto:tea-shop@example.com">Contact</a></li>
                <li><a href="admin-login">Admin</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script src="vendor/furni/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/shop.js"></script>
  </body>
</html>
