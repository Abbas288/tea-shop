name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Format, lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        id: install
        run: npm ci
      # Each check runs even if an earlier one failed, so one run shows every problem.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  build:
    name: Build and publish container
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cumulus
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Connect to deployment network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.SERVER_HOST }}
      - name: Deploy verified image
        shell: bash
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SITE_URL: ${{ vars.SITE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Set SERVER_HOST in the production environment.}"
          : "${SERVER_USER:?Set SERVER_USER in the production environment.}"
          : "${DEPLOY_PATH:?Set DEPLOY_PATH in the production environment.}"
          : "${SITE_URL:?Set SITE_URL in the production environment.}"
          : "${SSH_PRIVATE_KEY:?Set the SSH_PRIVATE_KEY secret.}"
          : "${SSH_KNOWN_HOSTS:?Set the SSH_KNOWN_HOSTS secret.}"

          # Remote commands use this path in single quotes.
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$SITE_URL" == https://* ]]

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          target="$SERVER_USER@$SERVER_HOST"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" -p "$SERVER_PORT" "$target" "test -f '$DEPLOY_PATH/.env'"
          scp "${ssh_options[@]}" -P "$SERVER_PORT" docker-compose.yml "$target:$DEPLOY_PATH/"

          remote_script=$(cat <<'BASH'
          set -euo pipefail
          cd -- "$1"
          export APP_IMAGE="$2"
          registry_user=$3
          site_url=$4
          [[ "$APP_IMAGE" =~ ^ghcr\.io/abbas288/tea-shop@sha256:[a-f0-9]{64}$ ]]
          test -f .env
          IFS= read -r registry_token

          registry_config=$(mktemp -d)
          trap 'rm -f -- "$registry_config/config.json"; rmdir -- "$registry_config"' EXIT
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$registry_config/config.json"
          printf '%s' "$registry_token" |
            docker --config "$registry_config" login ghcr.io --username "$registry_user" --password-stdin
          unset registry_token

          docker --config "$registry_config" compose pull app
          docker --config "$registry_config" compose up -d --no-build --wait --wait-timeout 120 app

          for url in "$site_url" "${site_url%/}/api/products"; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 20 --output /dev/null "$url"
          done
          BASH
          )

          printf -v remote_command 'bash -c %q -- %q %q %q %q' \
            "$remote_script" "$DEPLOY_PATH" "$APP_IMAGE" "$GITHUB_ACTOR" "$SITE_URL"
          printf '%s\n' "$REGISTRY_TOKEN" |
            ssh "${ssh_options[@]}" -p "$SERVER_PORT" "$target" "$remote_command"
