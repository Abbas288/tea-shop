<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Orders · Tea Shop admin</title>
    <link href="vendor/furni/css/bootstrap.min.css" rel="stylesheet" />
    <link href="vendor/bootstrap-examples/dashboard/dashboard.css" rel="stylesheet" />
  </head>
  <body>
    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
      <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="admin">Tea Shop admin</a>
      <button
        class="navbar-toggler position-absolute d-md-none collapsed"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#sidebarMenu"
        aria-controls="sidebarMenu"
        aria-expanded="false"
        aria-label="Show the menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="w-100"></div>
      <div class="navbar-nav">
        <div class="nav-item text-nowrap">
          <button class="nav-link px-3 btn btn-link" type="button" id="log-out">Log out</button>
        </div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row">
        <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
          <div class="position-sticky pt-3">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="admin">Orders</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./">Shop</a>
              </li>
            </ul>
          </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          >
            <h1 class="h2">Orders</h1>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-sm">
              <thead>
                <tr>
                  <th scope="col">Order</th>
                  <th scope="col">Placed</th>
                  <th scope="col">Status</th>
                  <th scope="col">Total</th>
                  <th scope="col"><span class="visually-hidden">Open</span></th>
                </tr>
              </thead>
              <tbody id="orders">
                <tr>
                  <td>-</td>
                  <td>-</td>
                  <td>received</td>
                  <td>0 kr</td>
                  <td><button class="btn btn-sm btn-outline-secondary" type="button">Open</button></td>
                </tr>
              </tbody>
            </table>
          </div>

          <h2 class="h4 mt-4">Order <span id="selected-order">-</span></h2>
          <p>Status: <strong id="selected-status">received</strong></p>
          <div class="btn-toolbar gap-2 mb-4" id="status-buttons">
            <button class="btn btn-sm btn-outline-secondary" type="button" disabled>pack</button>
            <button class="btn btn-sm btn-outline-danger" type="button" disabled>cancel</button>
          </div>
        </main>
      </div>
    </div>

    <script src="vendor/furni/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
